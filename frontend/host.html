<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>婚禮羽球大賽 - 大螢幕</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body { background: #111; overflow: hidden; margin: 0; padding: 0; }
    .scoreboard { display: flex; justify-content: space-between; padding: 20px 50px; font-size: 40px; color: white; font-weight: bold; }
    .team-left { color: #4facfe; }
    .team-right { color: #ff0844; }
    .score { font-size: 80px; }
    
    .court { position: relative; width: 100vw; height: 70vh; background: #2c3e50; border-top: 10px solid #fff; border-bottom: 10px solid #fff; margin-top: 20px; overflow: hidden;}
    .net { position: absolute; left: 50%; top: 0; width: 6px; height: 100%; background: #fff; transform: translateX(-50%); box-shadow: 0 0 10px #fff; }
    
    .shuttlecock {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60px;
      height: 60px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path fill="%23fff" d="M30 20 L50 80 L70 20 Z"/><circle cx="50" cy="80" r="15" fill="%23ffeb3b"/></svg>');
      background-size: contain;
      transform: translate(-50%, -50%);
      transition: left 0.1s ease-out;
      filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.5));
    }
    .status-text { text-align: center; color: yellow; font-size: 50px; font-weight: bold; position: absolute; width: 100%; top: 20%; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); z-index: 10;}
  </style>
</head>
<body>
  <div class="scoreboard">
    <div class="team-left">新郎隊 (左)<br><span class="score" id="score-left">0</span></div>
    <div>
      <button id="btn-start" style="padding: 15px 30px; font-size: 24px; cursor: pointer; border-radius: 10px;">開始比賽</button>
      <button id="btn-reset" style="padding: 15px 30px; font-size: 24px; cursor: pointer; border-radius: 10px;">重設</button>
    </div>
    <div class="team-right" style="text-align: right;">新娘隊 (右)<br><span class="score" id="score-right">0</span></div>
  </div>

  <div class="status-text" id="status-text">等待開始... (掃描手機參與)</div>

  <div class="court">
    <div class="net"></div>
    <div class="shuttlecock" id="shuttlecock"></div>
  </div>

  <script type="module" src="./host.js"></script>
</body>
</html>
