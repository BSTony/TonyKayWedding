<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>大廳 Lobby 🏸</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .lobby-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 0 12px;
    }
    .greeting { flex: 1; }
    .greeting h2 { font-size: 22px; font-weight: 900; }
    .greeting p { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .settings-btn {
      width: 40px; height: 40px;
      border: none;
      border-radius: 50%;
      background: var(--bg-card);
      cursor: pointer;
      font-size: 18px;
      box-shadow: var(--shadow);
      display: flex; align-items: center; justify-content: center;
    }
    .main-cta {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: var(--radius);
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(76,175,125,0.4);
      cursor: pointer;
      border: none;
      width: 100%;
      transition: all 0.15s;
    }
    .main-cta:active { transform: scale(0.98); }
    .main-cta .cta-icon { font-size: 48px; margin-bottom: 8px; display: block; }
    .main-cta .cta-title { font-size: 22px; font-weight: 900; color: white; display: block; }
    .main-cta .cta-sub { font-size: 13px; color: rgba(255,255,255,0.8); display: block; margin-top: 4px; }
    .quick-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .quick-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      cursor: pointer;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: all 0.15s;
      display: block;
    }
    .quick-card:active { transform: scale(0.97); }
    .quick-card .qc-icon { font-size: 32px; display: block; margin-bottom: 6px; }
    .quick-card .qc-label { font-size: 13px; font-weight: 700; color: var(--text-secondary); }
    .quick-card .qc-value { font-size: 20px; font-weight: 900; color: var(--text-primary); }
    .online-players {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .online-dot {
      width: 8px; height: 8px;
      background: var(--primary);
      border-radius: 50%;
      animation: pulse-dot 1.5s ease infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="page-bg"></div>
  <div class="page">
    <!-- Header -->
    <div class="lobby-header animate-slideDown">
      <div class="avatar" id="player-avatar" style="overflow:hidden; display:flex; align-items:center; justify-content:center;">🏆</div>
      <div class="greeting">
        <h2>HELLO, <span id="player-name">玩家</span>！</h2>
        <p id="account-status-text" style="font-size: 12px; margin-top: 2px;">歡迎來到婚禮大賽</p>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="settings-btn" id="btn-logout" title="登出 / 切換帳號" style="display:none; font-size:14px;">🚪</button>
        <button class="settings-btn" onclick="window.location.href='./nickname.html'" title="設定暱稱">⚙️</button>
      </div>
    </div>

    <!-- Google 綁定提示卡 (僅在訪客模式時顯示) -->
    <div id="guest-upgrade-card" class="card animate-fadeInUp" style="display:none; background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(240,253,244,0.95)); border: 1.5px solid #86efac; margin-bottom: 14px; padding: 12px 14px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
        <div>
          <div style="font-size:13px; font-weight:800; color:#166534; display:flex; align-items:center; gap:4px;">
            <span>🌟</span> 保存天梯積分與戰績
          </div>
          <div style="font-size:11px; color:#15803d; margin-top:2px;">登入 Google 帳號，每次進入自動代入積分！</div>
        </div>
        <button id="btn-lobby-google-login" style="background:#16a34a; color:white; border:none; border-radius:10px; padding:8px 12px; font-size:12px; font-weight:800; cursor:pointer; white-space:nowrap; box-shadow:0 2px 8px rgba(22,163,74,0.3);">
          Google 登入
        </button>
      </div>
    </div>

    <!-- Online Count -->
    <div class="online-players animate-fadeInUp" style="margin-bottom: 14px;">
      <div class="online-dot"></div>
      <span id="online-count">1</span> 位玩家在線上
    </div>

    <!-- Mode CTAs -->
    <div class="mode-selection animate-scaleIn" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;">
      <!-- Ranked Match Mode -->
      <button class="main-cta ranked-cta" onclick="window.location.href='./ranked.html?mode=play'" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9); box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4); position: relative; overflow: hidden;">
        <span class="cta-icon">🥇</span>
        <span class="cta-title">排位積分賽 (RANKED MATCH)</span>
        <span class="cta-sub">即時天梯對決 · 升降積分 (+5/+3/+1/-1/-3/-5)</span>
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap;">
          <span id="lobby-battling-badge" style="background: rgba(239, 68, 68, 0.35); border: 1px solid rgba(254, 202, 202, 0.5); border-radius: 12px; padding: 4px 10px; font-size: 12px; font-weight: 800; color: #fef08a; display: flex; align-items: center; gap: 4px;">
            🔥 <span id="lobby-battling-count">0</span> 人對戰中
          </span>
          <span id="lobby-queue-badge" style="background: rgba(59, 130, 246, 0.35); border: 1px solid rgba(191, 219, 254, 0.5); border-radius: 12px; padding: 4px 10px; font-size: 12px; font-weight: 800; color: #bfdbfe; display: flex; align-items: center; gap: 4px;">
            ⏳ <span id="lobby-queue-count">0</span> 人排隊中
          </span>
          <span onclick="event.stopPropagation(); window.location.href='./ranked.html?mode=spectate'" style="background: rgba(16, 185, 129, 0.45); border: 1.5px solid rgba(167, 243, 208, 0.7); border-radius: 12px; padding: 4px 12px; font-size: 12px; font-weight: 800; color: #ffffff; display: flex; align-items: center; gap: 4px; cursor: pointer; box-shadow: 0 2px 8px rgba(16,185,129,0.3);">
            👀 點擊觀戰 ➔
          </span>
        </div>
      </button>

      <!-- Tournament Mode -->
      <button class="main-cta tournament-cta" onclick="window.location.href='./tournament.html'" style="background: linear-gradient(135deg, #f59e0b, #b45309); box-shadow: 0 8px 24px rgba(245, 158, 11, 0.4);">
        <span class="cta-icon">🏆</span>
        <span class="cta-title">婚禮連線錦標賽 (TOURNAMENT)</span>
        <span class="cta-sub">隨機抽籤排位 · 即時連線對打 · 全員觀戰</span>
      </button>

      <!-- Challenge Boss AI Mode -->
      <button class="main-cta" onclick="window.location.href='./game.html?mode=single'">
        <span class="cta-icon">👿</span>
        <span class="cta-title">挑戰魔王電腦 (BOSS AI)</span>
        <span class="cta-sub">魔王級難度 · 挑戰大魔王新娘 KAY 👑</span>
      </button>
    </div>

    <!-- My Stats -->
    <p class="section-title animate-fadeInUp anim-delay-2">YOUR STATUS 戰績</p>
    <div class="card animate-fadeInUp anim-delay-2" style="margin-bottom: 16px;">
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-label">RANK 排名</div>
          <div class="stat-value" id="my-rank">#1</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">POINTS 積分</div>
          <div class="stat-value" id="my-points">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">WINS 勝場</div>
          <div class="stat-value" id="my-wins">0</div>
        </div>
      </div>
    </div>

    <!-- Recent ranking preview -->
    <p class="section-title animate-fadeInUp anim-delay-3">LIVE RANKING 即時排行</p>
    <div class="card animate-fadeInUp anim-delay-3" id="ranking-preview">
      <div class="rank-row my-row">
        <span class="rank-num gold">🥇</span>
        <span class="rank-name" id="preview-my-name">玩家</span>
        <span class="rank-points" id="preview-my-points">0 pts</span>
      </div>
    </div>
  </div>

  <script type="module">
    import './version.js';
    import { db, ref, onValue, set, get, update, auth, googleProvider, signInWithPopup, signOut, onAuthStateChanged } from './firebase.js';

    const EMOJIS = ['🏆', '👑', '⚡', '🌸', '🦋', '🎯', '🔥', '🌟', '💪', '🐼'];
    const PREFIXES = ['神級', '快樂', '幸運', '閃電', '霸氣', '隱世', '疾風', '甜蜜', '狂暴', '榮耀', '浪漫', '超能', '傳奇', '瀟灑', '帥氣', '絕代', '靈巧', '爆裂', '幻影', '璀璨', '巔峰', '無敵', '熱血', '極速', '王者'];
    const NOUNS = ['嘉賓', '選手', '球王', '刺客', '戰士', '劍客', '俠客', '大師', '狂人', '達人', '游俠', '勇者', '霸王', '飛俠', '戰將', '先鋒', '巨星', '傳說', '靈猴', '飛龍', '猛虎', '高手', '宗師', '奇才'];

    function generateUniqueRandomNickname() {
      const p = PREFIXES[Math.floor(Math.random() * PREFIXES.length)];
      const n = NOUNS[Math.floor(Math.random() * NOUNS.length)];
      const num = Math.floor(100 + Math.random() * 900);
      return `${p}${n}#${num}`;
    }
    
    // 檢查是否為 Google 登入者
    let isGoogleUser = localStorage.getItem('wbc_is_google') === 'true';
    let uid = localStorage.getItem('wbc_uid');
    let nickname = localStorage.getItem('wbc_nickname');
    let photoURL = localStorage.getItem('wbc_photo') || '';

    // 若為訪客且沒有暱稱，自動產生隨機不重複暱稱
    if (!nickname) {
      nickname = generateUniqueRandomNickname();
      localStorage.setItem('wbc_nickname', nickname);
    }

    // 若為訪客且沒有 uid，產生全新訪客 UID，初始積分 0
    if (!uid) {
      uid = 'guest_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      localStorage.setItem('wbc_uid', uid);
      localStorage.setItem('wbc_nickname', nickname);
      localStorage.setItem('wbc_points', 0);
      localStorage.setItem('wbc_wins', 0);
      localStorage.setItem('wbc_is_google', 'false');
    }

    const avatarEl = document.getElementById('player-avatar');
    const nameEl = document.getElementById('player-name');
    const statusTextEl = document.getElementById('account-status-text');
    const guestCardEl = document.getElementById('guest-upgrade-card');
    const btnLogout = document.getElementById('btn-logout');
    const btnLobbyGoogle = document.getElementById('btn-lobby-google-login');

    function renderUIProfile() {
      nameEl.textContent = nickname;
      document.getElementById('preview-my-name').textContent = nickname;

      if (isGoogleUser) {
        statusTextEl.innerHTML = '<span style="color:#10b981; font-weight:700;">🟢 Google 雲端存檔已連線</span>';
        guestCardEl.style.display = 'none';
        btnLogout.style.display = 'inline-flex';

        if (photoURL) {
          avatarEl.innerHTML = `<img src="${photoURL}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;" onerror="this.outerHTML='👑'">`;
        } else {
          avatarEl.textContent = '👑';
        }
      } else {
        statusTextEl.innerHTML = '<span style="color:#94a3b8; font-weight:600;">⚪ 訪客模式 (本次 0 分起計)</span>';
        guestCardEl.style.display = 'block';
        btnLogout.style.display = 'none';

        const code = nickname?.charCodeAt(0) || 0;
        avatarEl.textContent = EMOJIS[code % EMOJIS.length];
      }
    }

    renderUIProfile();

    // 🌟 自動對照與同步 Firebase Auth 登入者狀態 (免重複登入)
    onAuthStateChanged(auth, async (user) => {
      if (user && !user.isAnonymous) {
        const googleUid = 'google_' + user.uid;
        try {
          const snap = await get(ref(db, 'players/' + googleUid));
          let finalNickname = nickname;
          let points = Number(localStorage.getItem('wbc_points')) || 0;
          let wins = Number(localStorage.getItem('wbc_wins')) || 0;

          if (snap.exists()) {
            const data = snap.val();
            if (data.nickname) finalNickname = data.nickname;
            points = data.points !== undefined ? data.points : points;
            wins = data.wins !== undefined ? data.wins : wins;
          } else {
            await set(ref(db, 'players/' + googleUid), {
              uid: googleUid,
              nickname: finalNickname,
              photoURL: user.photoURL || '',
              points: 0,
              wins: 0,
              isGoogleUser: true,
              createdAt: Date.now(),
              lastSeen: Date.now()
            });
          }

          uid = googleUid;
          nickname = finalNickname;
          photoURL = user.photoURL || photoURL;
          isGoogleUser = true;

          localStorage.setItem('wbc_uid', googleUid);
          localStorage.setItem('wbc_nickname', finalNickname);
          localStorage.setItem('wbc_photo', photoURL);
          localStorage.setItem('wbc_is_google', 'true');
          localStorage.setItem('wbc_points', points);
          localStorage.setItem('wbc_wins', wins);

          document.getElementById('my-points').textContent = points;
          document.getElementById('my-wins').textContent = wins;
          renderUIProfile();
        } catch (e) {
          console.warn('Lobby auth sync error:', e);
        }
      }
    });

    // Google 登入按鈕
    btnLobbyGoogle.addEventListener('click', async () => {
      try {
        btnLobbyGoogle.disabled = true;
        btnLobbyGoogle.textContent = '登入中...';
        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;
        const googleUid = 'google_' + user.uid;
        const photo = user.photoURL || '';

        const playerSnap = await get(ref(db, 'players/' + googleUid));
        let points = 0;
        let wins = 0;
        let savedNickname = nickname || user.displayName || 'Google玩家';

        if (playerSnap.exists()) {
          const pData = playerSnap.val();
          points = pData.points !== undefined ? pData.points : 0;
          wins = pData.wins !== undefined ? pData.wins : 0;
          if (pData.nickname) savedNickname = pData.nickname;
        } else {
          await set(ref(db, 'players/' + googleUid), {
            uid: googleUid,
            nickname: savedNickname,
            photoURL: photo,
            points: 0,
            wins: 0,
            isGoogleUser: true,
            createdAt: Date.now(),
            lastSeen: Date.now()
          });
        }

        localStorage.setItem('wbc_uid', googleUid);
        localStorage.setItem('wbc_nickname', savedNickname);
        localStorage.setItem('wbc_photo', photo);
        localStorage.setItem('wbc_is_google', 'true');
        localStorage.setItem('wbc_points', points);
        localStorage.setItem('wbc_wins', wins);

        window.location.reload();
      } catch (err) {
        console.error('Lobby Google login error:', err);
        btnLobbyGoogle.disabled = false;
        btnLobbyGoogle.textContent = 'Google 登入';
        alert('Google 登入連線提示：' + (err.message || err));
      }
    });

    // 登出按鈕
    btnLogout.addEventListener('click', async () => {
      if (confirm('確定要登出 Google 帳號並切換為訪客模式嗎？')) {
        try {
          await signOut(auth);
        } catch (e) {}
        localStorage.clear();
        window.location.href = './nickname.html';
      }
    });

    // Firebase 註冊與狀態同步
    const playerRef = ref(db, 'players/' + uid);
    update(playerRef, {
      nickname,
      uid,
      status: 'lobby',
      isGoogleUser: isGoogleUser,
      lastSeen: Date.now()
    }).catch(() => {});

    // 監聽自身戰績數據
    onValue(playerRef, snap => {
      const d = snap.val();
      if (!d) return;
      document.getElementById('my-points').textContent = d.points || 0;
      document.getElementById('my-wins').textContent = d.wins || 0;
      localStorage.setItem('wbc_points', d.points || 0);
      localStorage.setItem('wbc_wins', d.wins || 0);
    });

    // 計算在線人數與即時排行榜
    const allPlayersRef = ref(db, 'players');
    onValue(allPlayersRef, snap => {
      const data = snap.val() || {};
      const allPlayersList = Object.values(data);
      
      // 計算在線人數 (最少 1 人)
      const online = allPlayersList.filter(p => Date.now() - (p.lastSeen || 0) < 120000);
      document.getElementById('online-count').textContent = Math.max(1, online.length);

      // 排行榜：排序所有玩家的積分
      let sorted = allPlayersList.sort((a, b) => (b.points || 0) - (a.points || 0));
      
      if (sorted.length === 0) {
        sorted = [{ uid, nickname, points: Number(document.getElementById('my-points').textContent) || 0 }];
      }

      // 我的排名
      const myIdx = sorted.findIndex(p => p.uid === uid);
      document.getElementById('my-rank').textContent = myIdx >= 0 ? '#' + (myIdx + 1) : '#1';

      // 渲染前 5 名
      const top5 = sorted.slice(0, 5);
      const rankEl = document.getElementById('ranking-preview');
      const medals = ['🥇', '🥈', '🥉'];
      
      rankEl.innerHTML = top5.map((p, i) => {
        const rankClass = i < 3 ? ['gold','silver','bronze'][i] : '';
        const googleMark = p.isGoogleUser ? ' <span style="font-size:10px; color:#10b981;">✓</span>' : '';
        return `<div class="rank-row ${p.uid === uid ? 'my-row' : ''}">
          <span class="rank-num ${rankClass}">${medals[i] || '#' + (i+1)}</span>
          <span class="rank-name">${p.nickname || '匿名玩家'}${googleMark}</span>
          <span class="rank-points">${p.points || 0} pts</span>
        </div>`;
      }).join('');
    }, err => {
      const rankEl = document.getElementById('ranking-preview');
      rankEl.innerHTML = `<div class="rank-row my-row">
        <span class="rank-num gold">🥇</span>
        <span class="rank-name">${nickname}</span>
        <span class="rank-points">0 pts</span>
      </div>`;
    });

    // ── 即時監聽排位賽排隊中與對戰中人數 ──
    const rankedQueueRef = ref(db, 'rankedQueue');
    onValue(rankedQueueRef, snap => {
      const q = snap.val() || {};
      const now = Date.now();
      const activeQueue = Object.values(q).filter(item => item && item.status === 'searching' && item.createdAt && (now - item.createdAt < 45000));
      const count = activeQueue.length;
      const el = document.getElementById('lobby-queue-count');
      if (el) el.textContent = count;
    });

    const rankedRoomsRef = ref(db, 'rankedRooms');
    onValue(rankedRoomsRef, snap => {
      const rooms = snap.val() || {};
      const now = Date.now();
      const activeRooms = Object.values(rooms).filter(r => r && r.status === 'playing' && !r.abandoned && r.createdAt && (now - r.createdAt < 5 * 60 * 1000));
      const battlingCount = activeRooms.length * 2;
      const el = document.getElementById('lobby-battling-count');
      if (el) el.textContent = battlingCount;
    });

    // 定期保活
    setInterval(() => {
      update(playerRef, { lastSeen: Date.now() }).catch(() => {});
    }, 15000);
  </script>
</body>
</html>
