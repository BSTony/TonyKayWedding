<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>開始對戰 🏸</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body { overflow: hidden; touch-action: manipulation; }
    .header { padding: 15px; display: flex; align-items: center; gap: 10px; }
    .header-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: none; background: var(--bg-card);
      box-shadow: var(--shadow); font-size: 18px; cursor: pointer;
    }
    
    /* 選擇隊伍畫面 */
    #screen-select { padding: 20px; text-align: center; }
    .team-cards { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; }
    .btn-team {
      background: var(--bg-card);
      border: 2px solid transparent;
      border-radius: var(--radius);
      padding: 24px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .btn-team.left { color: var(--primary); }
    .btn-team.right { color: var(--secondary); }
    .btn-team.computer { color: #8a2be2; border-color: #8a2be2; }
    
    /* 遊戲畫面 */
    #screen-game { display: flex; flex-direction: column; height: 100vh; }
    .game-header { text-align: center; padding: 20px; }
    #my-team-text { font-size: 24px; font-weight: 900; }
    #game-status {
      margin-top: 10px; padding: 8px 16px; border-radius: 20px;
      font-size: 14px; font-weight: 700; background: rgba(0,0,0,0.05);
    }
    
    .score-board {
      display: flex; justify-content: space-around; padding: 20px;
      background: var(--bg-card); margin: 0 20px; border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .score-col { text-align: center; }
    .score-label { font-size: 12px; color: var(--text-secondary); }
    .score-val { font-size: 32px; font-weight: 900; }
    .score-val.me { color: var(--primary); }
    .score-val.comp { color: var(--secondary); }

    .tap-area {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 30px;
    }
    #tap-btn {
      width: 100%; height: 100%; max-height: 400px;
      border-radius: 40px; border: none;
      font-size: 40px; font-weight: 900; color: white;
      background: var(--bg-card);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.05s;
      user-select: none;
    }
    #tap-btn:active { transform: scale(0.95); }
    #tap-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    /* 對戰電腦專屬 */
    .vs-computer-board { display: none; }
    .canvas-container { display: none; width: 100%; height: 50vh; background: #e0f7fa; position: relative; overflow: hidden; border-radius: 10px; margin-bottom: 10px; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }
    canvas { display: block; width: 100%; height: 100%; }
    .controls { display: none; padding: 10px 20px; gap: 15px; }
    .controls .dpad { display: flex; gap: 10px; flex: 1; }
    .controls .action { flex: 1; display: flex; justify-content: flex-end; }
    .btn-control { 
      background: var(--bg-card); border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border-radius: 12px; font-size: 24px; color: var(--primary); font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      user-select: none; touch-action: manipulation;
    }
    .btn-control:active { transform: scale(0.92); background: #eee; }
    .btn-dir { width: 60px; height: 60px; }
    .btn-hit { width: 100px; height: 60px; background: linear-gradient(135deg, var(--primary), #00f2fe); color: white; border-radius: 20px;}
    .btn-hit:active { background: var(--primary-dark); }
    
    #screen-game.mode-computer .vs-computer-board { display: flex; }
    #screen-game.mode-computer .global-board { display: none; }
    #screen-game.mode-computer .tap-area { display: none; }
    #screen-game.mode-computer .canvas-container { display: block; }
    #screen-game.mode-computer .controls { display: flex; }
    
  </style>
</head>
<body>
  <div class="page-bg"></div>
  
  <div class="header">
    <button class="header-btn" onclick="window.location.href='./lobby.html'">🔙</button>
    <h2 style="font-size: 18px; font-weight: 900;">比賽場地</h2>
  </div>

  <!-- 選擇隊伍 -->
  <div id="screen-select" class="animate-fadeInUp">
    <h1 style="font-size: 28px; font-weight:900;">選擇模式</h1>
    <p style="color:var(--text-secondary);">請選擇加入隊伍或進行單人練習</p>
    
    <div class="team-cards">
      <button class="btn-team left" data-team="left">
        <span style="font-size: 40px;">👦</span>
        加入 新郎隊
      </button>
      <button class="btn-team right" data-team="right">
        <span style="font-size: 40px;">👧</span>
        加入 新娘隊
      </button>
      <button class="btn-team computer" data-team="computer">
        <span style="font-size: 40px;">🏸</span>
        真實羽球對戰 (電腦)
      </button>
    </div>
  </div>

  <!-- 遊戲畫面 -->
  <div id="screen-game" class="hidden">
    <div class="game-header">
      <div id="my-team-text">準備中...</div>
      <div id="game-status">等待大螢幕開始...</div>
    </div>
    
    <!-- 全域連線對戰分數版 (原邏輯) -->
    <div class="score-board global-board">
      <div class="score-col">
        <div class="score-label">我的揮拍次數</div>
        <div class="score-val me" id="my-taps">0</div>
      </div>
    </div>
    
    <!-- 對戰電腦分數版 (新邏輯) -->
    <div class="score-board vs-computer-board" style="margin-bottom: 10px;">
      <div class="score-col">
        <div class="score-label">玩家 (Player)</div>
        <div class="score-val me" id="my-score-vs">0</div>
      </div>
      <div class="score-col" style="display:flex;align-items:center;font-weight:900;color:var(--border);">
        WIN 5
      </div>
      <div class="score-col">
        <div class="score-label">電腦 (Bot)</div>
        <div class="score-val comp" id="comp-score-vs">0</div>
      </div>
    </div>

    <!-- 真實羽球遊戲畫布 (僅電腦模式顯示) -->
    <div class="canvas-container animate-scaleIn">
      <canvas id="game-canvas"></canvas>
    </div>
    
    <!-- 真實羽球控制器 (僅電腦模式顯示) -->
    <div class="controls animate-fadeInUp">
      <div class="action" style="flex:1;">
        <button class="btn-control btn-hit" id="btn-hit" style="width: 100%; height: 80px; font-size: 28px;">揮拍 / 殺球 🏸</button>
      </div>
    </div>

    <!-- 多人狂點區域 (僅連線模式顯示) -->
    <div class="tap-area animate-scaleIn">
      <button id="tap-btn" disabled>準備中</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
