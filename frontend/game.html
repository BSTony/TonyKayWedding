<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>婚禮大賽 🏆</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      overflow: hidden;
      touch-action: manipulation;
      background: #0f172a;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 遊戲主容器：支援 100dvh 自動縮放 */
    #screen-game {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* 返回大廳按鈕 */
    .btn-back-lobby {
      position: absolute;
      top: max(12px, env(safe-area-inset-top, 12px));
      left: max(12px, env(safe-area-inset-left, 12px));
      z-index: 40;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      transition: all 0.15s;
    }
    .btn-back-lobby:active { transform: scale(0.9); }

    /* 頂部 HUD 標籤 */
    .tournament-hud {
      position: absolute;
      top: max(10px, env(safe-area-inset-top, 10px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.95), rgba(180, 83, 9, 0.95));
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 4px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.4);
      pointer-events: none;
      display: none;
      white-space: nowrap;
    }

    /* 左右雙方名字與計分面板 */
    .score-badge {
      position: absolute;
      top: max(12px, env(safe-area-inset-top, 12px));
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 6px 14px;
      min-width: 78px;
      user-select: none;
      pointer-events: none;
    }
    .score-badge.player-badge {
      left: 56px;
      border: 2px solid rgba(56, 189, 248, 0.85);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }
    .score-badge.comp-badge {
      right: max(14px, env(safe-area-inset-right, 14px));
      border: 2px solid rgba(244, 63, 94, 0.85);
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.4);
    }
    .badge-label {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      max-width: 100px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-badge .badge-label { color: #38bdf8; }
    .comp-badge .badge-label { color: #fb7185; }

    .badge-score {
      font-family: 'Press Start 2P', monospace;
      font-size: 22px;
      font-weight: bold;
      line-height: 1.1;
    }
    .player-badge .badge-score { color: #38bdf8; text-shadow: 0 0 12px rgba(56, 189, 248, 0.9); }
    .comp-badge .badge-score { color: #fb7185; text-shadow: 0 0 12px rgba(244, 63, 94, 0.9); }

    /* ─── 比例式自適應縮放 (Fluid Responsive Sizing via CSS Variables & clamp) ─── */
    :root {
      --dpad-cell-size: clamp(56px, 17.5vw, 84px);
      --dpad-gap: clamp(6px, 2vw, 10px);
      --dpad-padding: clamp(6px, 2vw, 10px);
      --dpad-radius: clamp(14px, 4vw, 22px);
      --dpad-font: clamp(24px, 7.5vw, 36px);
      --hit-btn-size: clamp(86px, 26vw, 116px);
      --hit-icon-size: clamp(32px, 9.5vw, 44px);
      --hit-text-size: clamp(11px, 3.2vw, 14px);
    }

    @media screen and (orientation: landscape) {
      :root {
        --dpad-cell-size: clamp(52px, 17vh, 76px);
        --dpad-gap: clamp(6px, 1.8vh, 10px);
        --dpad-padding: clamp(6px, 1.8vh, 10px);
        --dpad-radius: clamp(12px, 3.5vh, 18px);
        --dpad-font: clamp(22px, 7vh, 32px);
        --hit-btn-size: clamp(78px, 24vh, 108px);
        --hit-icon-size: clamp(28px, 8.5vh, 40px);
        --hit-text-size: clamp(10px, 3vh, 13px);
      }
    }

    /* ─── 虛擬手把按鈕共用樣式 ─── */
    .controls .dpad {
      display: grid;
      grid-template-columns: repeat(3, var(--dpad-cell-size));
      grid-template-rows: repeat(2, var(--dpad-cell-size));
      gap: var(--dpad-gap);
      pointer-events: auto;
      touch-action: none;
      background: rgba(15, 23, 42, 0.6);
      padding: var(--dpad-padding);
      border-radius: calc(var(--dpad-radius) + 8px);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }
    .btn-dir {
      background: radial-gradient(circle, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.09) 100%);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: var(--dpad-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
      color: white;
      font-size: var(--dpad-font);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.6);
      transition: transform 0.08s ease, background 0.08s ease;
    }
    .btn-dir:active, .btn-dir.active {
      transform: scale(0.88);
      background: radial-gradient(circle, rgba(56, 189, 248, 0.75) 0%, rgba(14, 165, 233, 0.4) 100%);
      border-color: #38bdf8;
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.9);
    }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }

    .controls .action {
      display: flex;
      align-items: flex-end;
      pointer-events: auto;
      touch-action: none;
    }
    .btn-hit {
      width: var(--hit-btn-size);
      height: var(--hit-btn-size);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.75) 0%, rgba(185, 28, 28, 0.5) 100%);
      border: 3.5px solid rgba(254, 202, 202, 0.9);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
      box-shadow: 0 0 28px rgba(239, 68, 68, 0.7), 0 12px 32px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.7);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      cursor: pointer;
    }
    .btn-hit:active, .btn-hit.active {
      transform: scale(0.86);
      background: radial-gradient(circle, rgba(248, 113, 113, 0.98) 0%, rgba(220, 38, 38, 0.85) 100%);
      box-shadow: 0 0 42px rgba(239, 68, 68, 0.95), 0 4px 16px rgba(0,0,0,0.8);
    }
    .btn-hit-icon { font-size: var(--hit-icon-size); line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
    .btn-hit-text { font-size: var(--hit-text-size); font-weight: 900; letter-spacing: 1px; margin-top: 3px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

    /* ─── 橫向佈局 (Landscape) ─── */
    @media screen and (orientation: landscape) {
      .game-ui {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .canvas-container {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: 100%;
        aspect-ratio: 432 / 304;
        object-fit: contain;
        background: #0f172a;
        image-rendering: auto;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
        border-radius: 8px;
      }
      .controls {
        position: absolute;
        bottom: max(14px, env(safe-area-inset-bottom, 14px));
        left: 0; width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0 max(24px, env(safe-area-inset-right, 24px));
        z-index: 25;
        pointer-events: none;
        box-sizing: border-box;
      }
    }

    /* ─── 直向佈局 (Portrait - 上方球場 + 下方自適應手把) ─── */
    @media screen and (orientation: portrait) {
      .game-ui {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        justify-content: space-between;
        box-sizing: border-box;
      }
      .canvas-container {
        position: relative;
        width: 100%;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 10px 10px 10px;
        box-sizing: border-box;
        min-height: 200px;
      }
      canvas {
        display: block;
        width: 100% !important;
        height: auto !important;
        max-height: 100%;
        aspect-ratio: 432 / 304;
        object-fit: contain;
        background: #0f172a;
        image-rendering: auto;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
        border-radius: 12px;
        border: 2px solid rgba(255, 255, 255, 0.15);
      }
      .controls {
        position: relative !important;
        bottom: auto !important;
        left: auto !important;
        width: 100% !important;
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        padding: 14px 16px max(20px, env(safe-area-inset-bottom, 20px)) 16px !important;
        background: rgba(15, 23, 42, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        box-sizing: border-box;
        z-index: 25;
      }
    }

    /* ─── 結算彈窗 ─── */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.25s ease;
    }
    .modal-card {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 24px 30px;
      text-align: center;
      max-width: 320px;
      width: 85%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      color: white;
    }
    .modal-icon { font-size: 52px; margin-bottom: 8px; }
    .modal-title { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
    .modal-desc { font-size: 13px; color: rgba(255,255,255,0.8); margin-bottom: 20px; line-height: 1.5; }
    .modal-btns { display: flex; flex-direction: column; gap: 10px; }
    .modal-btn {
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.15s;
    }
    .modal-btn.primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
    }
    .modal-btn.secondary {
      background: rgba(255,255,255,0.15);
      color: white;
    }
    .modal-btn:active { transform: scale(0.97); }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="screen-game">
    <div class="game-ui">
      <!-- 返回大廳按鈕 -->
      <button class="btn-back-lobby" onclick="window.location.href='./lobby.html'" title="返回大廳">🔙</button>

      <!-- 錦標賽階段 HUD -->
      <div class="tournament-hud" id="tournament-hud">
        🏆 <span id="tournament-round-title">第一輪 八強賽</span>
      </div>

      <!-- 畫布容器 -->
      <div class="canvas-container">
        <canvas id="game-canvas"></canvas>
      </div>

      <!-- 分離式左/右名字與計分板 -->
      <div class="score-badge player-badge">
        <div class="badge-label" id="player-name-badge">👦 玩家</div>
        <div class="badge-score" id="my-score-vs">0</div>
      </div>
      <div class="score-badge comp-badge">
        <div class="badge-label" id="opponent-name-badge">👰 KAY</div>
        <div class="badge-score" id="comp-score-vs">0</div>
      </div>

      <!-- 現代手遊按鈕：左手 D-pad ＋ 右手大圓攻擊鍵 -->
      <div class="controls">
        <div class="dpad" id="dpad-container">
          <button class="btn-dir" id="btn-up" data-dir="up">⬆️</button>
          <button class="btn-dir" id="btn-left" data-dir="left">⬅️</button>
          <div class="dpad-center"></div>
          <button class="btn-dir" id="btn-right" data-dir="right">➡️</button>
          <button class="btn-dir" id="btn-down" data-dir="down">⬇️</button>
        </div>

        <div class="action">
          <button class="btn-hit" id="btn-hit">
            <span class="btn-hit-icon">⚡</span>
            <span class="btn-hit-text">殺球</span>
          </button>
        </div>
      </div>

      <!-- 比賽結果彈窗 -->
      <div class="modal-overlay" id="match-modal">
        <div class="modal-card">
          <div class="modal-icon" id="modal-icon">🎉</div>
          <div class="modal-title" id="modal-title">勝利！</div>
          <div class="modal-desc" id="modal-desc">獲得積分！</div>
          <div class="modal-btns">
            <button class="modal-btn primary" id="modal-btn-next">再戰一場 ➔</button>
            <button class="modal-btn secondary" id="modal-btn-lobby" onclick="window.location.href='./lobby.html'">返回大廳</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
