<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>婚禮大賽 🏆</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      overflow: hidden;
      touch-action: manipulation;
      background: #0f172a;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 遊戲主容器：支援 100dvh 自動縮放 */
    #screen-game {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* 返回大廳按鈕 */
    .btn-back-lobby {
      position: absolute;
      top: max(12px, env(safe-area-inset-top, 12px));
      left: max(12px, env(safe-area-inset-left, 12px));
      z-index: 40;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      transition: all 0.15s;
    }
    .btn-back-lobby:active { transform: scale(0.9); }

    /* 頂部 HUD 標籤 */
    .tournament-hud {
      position: absolute;
      top: max(10px, env(safe-area-inset-top, 10px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.95), rgba(180, 83, 9, 0.95));
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 4px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.4);
      pointer-events: none;
      display: none;
      white-space: nowrap;
    }

    /* 左右雙方名字與計分面板 */
    .score-badge {
      position: absolute;
      top: max(12px, env(safe-area-inset-top, 12px));
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 6px 14px;
      min-width: 78px;
      user-select: none;
      pointer-events: none;
    }
    .score-badge.player-badge {
      left: 56px;
      border: 2px solid rgba(56, 189, 248, 0.85);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }
    .score-badge.comp-badge {
      right: max(14px, env(safe-area-inset-right, 14px));
      border: 2px solid rgba(244, 63, 94, 0.85);
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.4);
    }
    .badge-label {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      max-width: 100px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-badge .badge-label { color: #38bdf8; }
    .comp-badge .badge-label { color: #fb7185; }

    .badge-score {
      font-family: 'Press Start 2P', monospace;
      font-size: 22px;
      font-weight: bold;
      line-height: 1.1;
    }
    .player-badge .badge-score { color: #38bdf8; text-shadow: 0 0 12px rgba(56, 189, 248, 0.9); }
    .comp-badge .badge-score { color: #fb7185; text-shadow: 0 0 12px rgba(244, 63, 94, 0.9); }

    /* ─── 比例式自適應縮放 (Fluid Responsive Sizing via CSS Variables & clamp) ─── */
    :root {
      --dpad-cell-size: clamp(56px, 17.5vw, 84px);
      --dpad-gap: clamp(6px, 2vw, 10px);
      --dpad-padding: clamp(6px, 2vw, 10px);
      --dpad-radius: clamp(14px, 4vw, 22px);
      --dpad-font: clamp(24px, 7.5vw, 36px);
      --hit-btn-size: clamp(86px, 26vw, 116px);
      --hit-icon-size: clamp(32px, 9.5vw, 44px);
      --hit-text-size: clamp(11px, 3.2vw, 14px);
    }

    @media screen and (orientation: landscape) {
      :root {
        --dpad-cell-size: clamp(52px, 17vh, 76px);
        --dpad-gap: clamp(6px, 1.8vh, 10px);
        --dpad-padding: clamp(6px, 1.8vh, 10px);
        --dpad-radius: clamp(12px, 3.5vh, 18px);
        --dpad-font: clamp(22px, 7vh, 32px);
        --hit-btn-size: clamp(78px, 24vh, 108px);
        --hit-icon-size: clamp(28px, 8.5vh, 40px);
        --hit-text-size: clamp(10px, 3vh, 13px);
      }
    }

    /* ─── 圓盤虛擬搖桿 (Joystick Disc) ─── */
    .controls .joystick-disc {
      position: relative;
      width: clamp(125px, 34vw, 155px);
      height: clamp(125px, 34vw, 155px);
      max-width: 165px;
      max-height: 165px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30, 41, 59, 0.75) 0%, rgba(15, 23, 42, 0.92) 100%);
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65), inset 0 0 20px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      user-select: none;
      pointer-events: auto;
    }

    .joystick-arrows {
      position: absolute;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .j-arrow {
      position: absolute;
      font-size: 13px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.4);
      text-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
      transition: color 0.08s, transform 0.08s;
    }
    .j-arrow.active {
      color: #38bdf8;
      text-shadow: 0 0 14px #38bdf8;
      transform: scale(1.25);
    }
    .j-up    { top: 8px; left: 50%; transform: translateX(-50%); }
    .j-down  { bottom: 8px; left: 50%; transform: translateX(-50%); }
    .j-left  { left: 8px; top: 50%; transform: translateY(-50%); }
    .j-right { right: 8px; top: 50%; transform: translateY(-50%); }

    /* 八向微光引導圈 */
    .joystick-crosshair {
      position: absolute;
      width: 62%; height: 62%;
      border-radius: 50%;
      border: 1.5px dashed rgba(255, 255, 255, 0.18);
      pointer-events: none;
    }

    /* 搖桿推桿中心圓鈕 */
    .joystick-knob {
      width: clamp(52px, 14vw, 62px);
      height: clamp(52px, 14vw, 62px);
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8 0%, #0284c7 65%, #0369a1 100%);
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 18px rgba(2, 132, 199, 0.7), inset 0 2px 4px rgba(255, 255, 255, 0.8);
      pointer-events: none;
      transform: translate(0px, 0px);
      transition: transform 0.04s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .joystick-knob::after {
      content: '';
      width: 18px; height: 18px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.95);
    }
    .joystick-knob.active {
      box-shadow: 0 0 26px rgba(56, 189, 248, 0.95), inset 0 2px 6px rgba(255, 255, 255, 0.95);
    }

    /* ─── 右手雙按鈕群組 (跳躍 Jump ＋ 殺球 Hit) ─── */
    .controls .action {
      display: flex;
      align-items: flex-end;
      pointer-events: auto;
      touch-action: none;
    }

    .action-buttons-group {
      display: flex;
      align-items: center;
      gap: clamp(10px, 3vw, 16px);
      pointer-events: auto;
      touch-action: none;
    }

    .btn-action {
      width: clamp(62px, 17vw, 82px);
      height: clamp(62px, 17vw, 82px);
      border-radius: 50%;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      cursor: pointer;
    }
    .btn-action:active, .btn-action.active {
      transform: scale(0.88);
    }
    .btn-action-icon {
      font-size: clamp(20px, 6vw, 28px);
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .btn-action-text {
      font-size: clamp(11px, 3vw, 13px);
      font-weight: 900;
      letter-spacing: 1px;
      margin-top: 3px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* 跳躍鍵 (Sky Blue) */
    .btn-jump {
      background: radial-gradient(circle, rgba(14, 165, 233, 0.8) 0%, rgba(2, 132, 199, 0.55) 100%);
      border: 3px solid rgba(186, 230, 253, 0.9);
      box-shadow: 0 0 24px rgba(14, 165, 233, 0.7), 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.8);
    }
    .btn-jump:active, .btn-jump.active {
      box-shadow: 0 0 36px rgba(56, 189, 248, 0.95), 0 4px 12px rgba(0, 0, 0, 0.8);
      background: radial-gradient(circle, rgba(56, 189, 248, 0.98) 0%, rgba(14, 165, 233, 0.85) 100%);
    }

    /* 殺球鍵 (Ruby Red) */
    .btn-hit {
      background: radial-gradient(circle, rgba(239, 68, 68, 0.8) 0%, rgba(185, 28, 28, 0.55) 100%);
      border: 3px solid rgba(254, 202, 202, 0.9);
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.7), 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.8);
    }
    .btn-hit:active, .btn-hit.active {
      box-shadow: 0 0 36px rgba(239, 68, 68, 0.95), 0 4px 12px rgba(0, 0, 0, 0.8);
      background: radial-gradient(circle, rgba(248, 113, 113, 0.98) 0%, rgba(220, 38, 38, 0.85) 100%);
    }

    /* ─── 核心自適應佈局 (球場在上方完整呈現、手把在下方，絕不互相遮擋) ─── */
    .game-ui {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      justify-content: space-between;
      box-sizing: border-box;
    }
    .canvas-container {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 10px 10px 10px;
      box-sizing: border-box;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 432 / 304;
      object-fit: contain;
      background: #0f172a;
      image-rendering: auto;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.15);
    }
    .controls {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px max(16px, env(safe-area-inset-bottom, 16px)) 16px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      box-sizing: border-box;
      z-index: 25;
      flex-shrink: 0;
    }

    /* ─── 僅在超寬橫向螢幕 (寬高比 >= 1.7) 啟用兩側懸浮手把 ─── */
    @media screen and (min-aspect-ratio: 17/10) and (min-height: 320px) {
      .canvas-container {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        padding: 50px 20px 20px 20px;
      }
      .controls {
        position: absolute;
        bottom: max(10px, env(safe-area-inset-bottom, 10px));
        left: 0;
        background: transparent;
        border-top: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        padding: 0 max(24px, env(safe-area-inset-right, 24px));
        pointer-events: none;
      }
    }

    /* ─── 結算彈窗 ─── */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.25s ease;
    }
    .modal-card {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 24px 30px;
      text-align: center;
      max-width: 320px;
      width: 85%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      color: white;
    }
    .modal-icon { font-size: 52px; margin-bottom: 8px; }
    .modal-title { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
    .modal-desc { font-size: 13px; color: rgba(255,255,255,0.8); margin-bottom: 20px; line-height: 1.5; }
    .modal-btns { display: flex; flex-direction: column; gap: 10px; }
    .modal-btn {
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.15s;
    }
    .modal-btn.primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
    }
    .modal-btn.secondary {
      background: rgba(255,255,255,0.15);
      color: white;
    }
    .modal-btn:active { transform: scale(0.97); }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="screen-game">
    <div class="game-ui">
      <!-- 返回大廳按鈕 -->
      <button class="btn-back-lobby" onclick="window.location.href='./lobby.html'" title="返回大廳">🔙</button>

      <!-- 錦標賽階段 HUD -->
      <div class="tournament-hud" id="tournament-hud">
        🏆 <span id="tournament-round-title">第一輪 八強賽</span>
      </div>

      <!-- 畫布容器 -->
      <div class="canvas-container">
        <canvas id="game-canvas"></canvas>
      </div>

      <!-- 分離式左/右名字與計分板 -->
      <div class="score-badge player-badge">
        <div class="badge-label" id="player-name-badge">👦 玩家</div>
        <div class="badge-score" id="my-score-vs">0</div>
      </div>
      <div class="score-badge comp-badge">
        <div class="badge-label" id="opponent-name-badge">👰 KAY</div>
        <div class="badge-score" id="comp-score-vs">0</div>
      </div>

      <!-- 手遊八向圓盤手把 (左手 360° 圓盤搖桿 ＋ 右手【跳躍 Jump】＋【殺球 Hit】雙鍵) -->
      <div class="controls">
        <div class="joystick-disc" id="joystick-disc">
          <div class="joystick-arrows">
            <span class="j-arrow j-up" id="j-up">▲</span>
            <span class="j-arrow j-right" id="j-right">►</span>
            <span class="j-arrow j-down" id="j-down">▼</span>
            <span class="j-arrow j-left" id="j-left">◄</span>
          </div>
          <div class="joystick-crosshair"></div>
          <div class="joystick-knob" id="joystick-knob"></div>
        </div>

        <div class="action">
          <div class="action-buttons-group">
            <button class="btn-action btn-jump" id="btn-jump">
              <span class="btn-action-icon">🚀</span>
              <span class="btn-action-text">跳躍</span>
            </button>
            <button class="btn-action btn-hit" id="btn-hit">
              <span class="btn-action-icon">⚡</span>
              <span class="btn-action-text">殺球</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 比賽結果彈窗 -->
      <div class="modal-overlay" id="match-modal">
        <div class="modal-card">
          <div class="modal-icon" id="modal-icon">🎉</div>
          <div class="modal-title" id="modal-title">勝利！</div>
          <div class="modal-desc" id="modal-desc">獲得積分！</div>
          <div class="modal-btns">
            <button class="modal-btn primary" id="modal-btn-next">再戰一場 ➔</button>
            <button class="modal-btn secondary" id="modal-btn-lobby" onclick="window.location.href='./lobby.html'">返回大廳</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
