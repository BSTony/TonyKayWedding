<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>開始對戰 🏸</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body { overflow: hidden; touch-action: manipulation; }
    .header { padding: 15px; display: flex; align-items: center; gap: 10px; }
    .header-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: none; background: var(--bg-card);
      box-shadow: var(--shadow); font-size: 18px; cursor: pointer;
    }
    
    /* 選擇隊伍畫面 */
    #screen-select { padding: 20px; text-align: center; }
    .team-cards { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; }
    .btn-team {
      background: var(--bg-card);
      border: 2px solid transparent;
      border-radius: var(--radius);
      padding: 24px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .btn-team.left { color: var(--primary); }
    .btn-team.right { color: var(--secondary); }
    .btn-team.computer { color: #8a2be2; border-color: #8a2be2; }
    
    /* 遊戲畫面 */
    #screen-game { display: flex; flex-direction: column; height: 100vh; }
    .game-header { text-align: center; padding: 20px; }
    #my-team-text { font-size: 24px; font-weight: 900; }
    #game-status {
      margin-top: 10px; padding: 8px 16px; border-radius: 20px;
      font-size: 14px; font-weight: 700; background: rgba(0,0,0,0.05);
    }
    
    .score-board {
      display: flex; justify-content: space-around; padding: 20px;
      background: var(--bg-card); margin: 0 20px; border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .score-col { text-align: center; }
    .score-label { font-size: 12px; color: var(--text-secondary); }
    .score-val { font-size: 32px; font-weight: 900; }
    .score-val.me { color: var(--primary); }
    .score-val.comp { color: var(--secondary); }

    .tap-area {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 30px;
    }
    #tap-btn {
      width: 100%; height: 100%; max-height: 400px;
      border-radius: 40px; border: none;
      font-size: 40px; font-weight: 900; color: white;
      background: var(--bg-card);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.05s;
      user-select: none;
    }
    #tap-btn:active { transform: scale(0.95); }
    #tap-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    /* 對戰電腦專屬 (皮卡丘排球版) */
    .vs-computer-board { display: none; }
    
    /* 當進入電腦模式時，強制全螢幕覆蓋 */
    #screen-game.mode-computer {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 9999;
      display: flex; justify-content: center; align-items: center;
    }
    
    /* 如果是直向，提示轉橫向 */
    .rotate-prompt {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); color: white; flex-direction: column;
      align-items: center; justify-content: center; z-index: 10000;
      font-size: 24px; font-weight: bold; text-align: center; padding: 20px;
    }
    @media screen and (orientation: portrait) {
      #screen-game.mode-computer .rotate-prompt { display: flex; }
      #screen-game.mode-computer .game-ui { display: none !important; }
    }
    
    /* 遊戲主要介面 */
    .game-ui {
      position: relative; width: 100%; height: 100%; display: none;
    }
    #screen-game.mode-computer .game-ui { display: block; }
    
    /* 畫布 */
    .canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; background: #e0f7fa; }
    
    /* 橫向分數板 */
    .score-board.vs-computer-board {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 30px; background: rgba(255,255,255,0.8);
      padding: 5px 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 10; margin: 0;
    }
    
    /* 虛擬手把 (浮在畫面上) */
    .controls {
      position: absolute; bottom: 10px; left: 0; width: 100%;
      display: flex; justify-content: space-between; padding: 0 20px; z-index: 20;
      pointer-events: none; /* 讓點擊穿透到按鈕 */
    }
    
    /* 左邊：殺球按鈕 */
    .controls .action { display: flex; align-items: flex-end; pointer-events: auto; }
    .btn-hit { 
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(255, 8, 68, 0.5); border: 2px solid rgba(255,255,255,0.5);
      color: white; font-size: 20px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      user-select: none; touch-action: manipulation;
    }
    .btn-hit:active { background: rgba(255, 8, 68, 0.8); transform: scale(0.95); }
    
    /* 右邊：十字鍵 */
    .controls .dpad {
      display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px 60px;
      gap: 5px; pointer-events: auto; opacity: 0.7;
    }
    .btn-dir {
      background: rgba(255,255,255,0.5); border: 1px solid rgba(0,0,0,0.2);
      border-radius: 10px; font-size: 24px; display: flex; align-items: center; justify-content: center;
      user-select: none; touch-action: manipulation; color: #000;
    }
    .btn-dir:active { background: rgba(255,255,255,0.8); transform: scale(0.95); }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 3; }
    
    #screen-game.mode-computer .global-board, #screen-game.mode-computer .game-header, #screen-game.mode-computer .tap-area { display: none; }
    
  </style>
</head>
<body>
  <div class="page-bg"></div>
  
  <div class="header">
    <button class="header-btn" onclick="window.location.href='./lobby.html'">🔙</button>
    <h2 style="font-size: 18px; font-weight: 900;">比賽場地</h2>
  </div>

  <!-- 選擇隊伍 -->
  <div id="screen-select" class="animate-fadeInUp">
    <h1 style="font-size: 28px; font-weight:900;">選擇模式</h1>
    <p style="color:var(--text-secondary);">請選擇加入隊伍或進行單人練習</p>
    
    <div class="team-cards">
      <button class="btn-team left" data-team="left">
        <span style="font-size: 40px;">👦</span>
        加入 新郎隊
      </button>
      <button class="btn-team right" data-team="right">
        <span style="font-size: 40px;">👧</span>
        加入 新娘隊
      </button>
      <button class="btn-team computer" data-team="computer">
        <span style="font-size: 40px;">🏐</span>
        皮卡丘打排球 (單機版)
      </button>
    </div>
  </div>

  <!-- 遊戲畫面 -->
  <div id="screen-game" class="hidden">
    <div class="game-header">
      <div id="my-team-text">準備中...</div>
      <div id="game-status">等待大螢幕開始...</div>
    </div>
    
    <!-- 全域連線對戰分數版 (原邏輯) -->
    <div class="score-board global-board">
      <div class="score-col">
        <div class="score-label">我的揮拍次數</div>
        <div class="score-val me" id="my-taps">0</div>
      </div>
    </div>
    
    <!-- 皮卡丘打排球 (全螢幕模式) -->
    <div class="rotate-prompt">
      <div style="font-size: 50px;">🔄</div>
      <div>請將手機轉為橫向<br>以進行遊戲</div>
    </div>
    
    <div class="game-ui">
      <!-- 畫布 -->
      <div class="canvas-container">
        <canvas id="game-canvas"></canvas>
      </div>
      
      <!-- 橫向分數板 -->
      <div class="score-board vs-computer-board">
        <div class="score-col">
          <div class="score-val me" id="my-score-vs" style="font-size:24px;">0</div>
        </div>
        <div class="score-col" style="display:flex;align-items:center;font-weight:900;font-size:12px;">
          WIN 5
        </div>
        <div class="score-col">
          <div class="score-val comp" id="comp-score-vs" style="font-size:24px;">0</div>
        </div>
      </div>
      
      <!-- 虛擬手把 -->
      <div class="controls">
        <div class="action">
          <button class="btn-hit" id="btn-hit">殺球/跳</button>
        </div>
        <div class="dpad">
          <button class="btn-dir" id="btn-up">⬆️</button>
          <button class="btn-dir" id="btn-left">⬅️</button>
          <button class="btn-dir" id="btn-right">➡️</button>
          <button class="btn-dir" id="btn-down">⬇️</button>
        </div>
      </div>
    </div>

    <!-- 多人狂點區域 (僅連線模式顯示) -->
    <div class="tap-area animate-scaleIn">
      <button id="tap-btn" disabled>準備中</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
