<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>婚禮大賽 🏆</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      overflow: hidden;
      touch-action: manipulation;
      background: #0f172a;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 遊戲主容器：支援 100dvh 自動縮放 */
    #screen-game {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* 返回大廳按鈕 */
    .btn-back-lobby {
      position: absolute;
      top: max(12px, env(safe-area-inset-top, 12px));
      left: max(12px, env(safe-area-inset-left, 12px));
      z-index: 40;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      transition: all 0.15s;
    }
    .btn-back-lobby:active { transform: scale(0.9); }

    /* 頂部 HUD 標籤 */
    .tournament-hud {
      position: absolute;
      top: max(10px, env(safe-area-inset-top, 10px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.95), rgba(180, 83, 9, 0.95));
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 4px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.4);
      pointer-events: none;
      display: none;
      white-space: nowrap;
    }

    /* 左右雙方名字與計分面板 */
    .score-badge {
      position: absolute;
      top: max(12px, env(safe-area-inset-top, 12px));
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 6px 14px;
      min-width: 78px;
      user-select: none;
      pointer-events: none;
    }
    .score-badge.player-badge {
      left: 56px;
      border: 2px solid rgba(56, 189, 248, 0.85);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }
    .score-badge.comp-badge {
      right: max(14px, env(safe-area-inset-right, 14px));
      border: 2px solid rgba(244, 63, 94, 0.85);
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.4);
    }
    .badge-label {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      max-width: 100px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-badge .badge-label { color: #38bdf8; }
    .comp-badge .badge-label { color: #fb7185; }

    .badge-score {
      font-family: 'Press Start 2P', monospace;
      font-size: 22px;
      font-weight: bold;
      line-height: 1.1;
    }
    .player-badge .badge-score { color: #38bdf8; text-shadow: 0 0 12px rgba(56, 189, 248, 0.9); }
    .comp-badge .badge-score { color: #fb7185; text-shadow: 0 0 12px rgba(244, 63, 94, 0.9); }

    /* ─── 比例式自適應縮放 (Fluid Responsive Sizing via CSS Variables & clamp) ─── */
    :root {
      --dpad-cell-size: clamp(56px, 17.5vw, 84px);
      --dpad-gap: clamp(6px, 2vw, 10px);
      --dpad-padding: clamp(6px, 2vw, 10px);
      --dpad-radius: clamp(14px, 4vw, 22px);
      --dpad-font: clamp(24px, 7.5vw, 36px);
      --hit-btn-size: clamp(86px, 26vw, 116px);
      --hit-icon-size: clamp(32px, 9.5vw, 44px);
      --hit-text-size: clamp(11px, 3.2vw, 14px);
    }

    @media screen and (orientation: landscape) {
      :root {
        --dpad-cell-size: clamp(52px, 17vh, 76px);
        --dpad-gap: clamp(6px, 1.8vh, 10px);
        --dpad-padding: clamp(6px, 1.8vh, 10px);
        --dpad-radius: clamp(12px, 3.5vh, 18px);
        --dpad-font: clamp(22px, 7vh, 32px);
        --hit-btn-size: clamp(78px, 24vh, 108px);
        --hit-icon-size: clamp(28px, 8.5vh, 40px);
        --hit-text-size: clamp(10px, 3vh, 13px);
      }
    }

    /* ─── 實體鍵盤風格按鍵 (Keyboard Keycap Style) ─── */
    .keyboard-cluster {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(4px, 1.2vw, 8px);
      user-select: none;
      touch-action: none;
      pointer-events: auto;
    }

    .keycap-row {
      display: flex;
      gap: clamp(4px, 1.2vw, 8px);
      justify-content: center;
    }

    .keycap-btn {
      position: relative;
      width: clamp(48px, 13vw, 66px);
      height: clamp(46px, 12.5vw, 62px);
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-bottom: 5px solid #0f172a; /* 鍵帽 3D 厚度立體邊緣 */
      border-radius: 10px;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.35);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      transition: all 0.05s ease;
      font-family: inherit;
    }

    .keycap-btn:active, .keycap-btn.active {
      transform: translateY(4px); /* 鍵盤真實下壓感 */
      border-bottom-width: 1.5px;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.85), inset 0 2px 4px rgba(0, 0, 0, 0.4);
      color: #ffffff;
    }

    .keycap-icon {
      font-size: clamp(16px, 4.5vw, 22px);
      line-height: 1;
      font-weight: 900;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
    }

    .keycap-sub {
      font-size: clamp(9px, 2.4vw, 11px);
      color: rgba(255, 255, 255, 0.65);
      font-weight: 700;
      margin-top: 2px;
      line-height: 1;
      font-family: monospace;
      letter-spacing: 0.5px;
    }

    /* 右側動作鍵群組 (鍵盤風格) */
    .keycap-action-group {
      display: flex;
      gap: clamp(8px, 2.5vw, 16px);
      align-items: center;
      pointer-events: auto;
      touch-action: none;
    }

    .keycap-action-btn {
      width: clamp(68px, 18vw, 92px);
      height: clamp(52px, 14vw, 70px);
      border-radius: 12px;
    }

    .keycap-label {
      font-size: clamp(11px, 3vw, 13px);
      font-weight: 900;
      margin-top: 1px;
      line-height: 1.1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* 跳躍鍵 (Sky Blue 鍵盤配色) */
    .keycap-jump {
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      border: 1.5px solid rgba(186, 230, 253, 0.4);
      border-bottom: 5px solid #082f49;
      box-shadow: 0 5px 14px rgba(2, 132, 199, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.5);
    }
    .keycap-jump:active, .keycap-jump.active {
      transform: translateY(4px);
      border-bottom-width: 1.5px;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.95);
    }

    /* 殺球鍵 (Ruby Red 鍵盤配色) */
    .keycap-hit {
      background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
      border: 1.5px solid rgba(254, 202, 202, 0.4);
      border-bottom: 5px solid #450a0a;
      box-shadow: 0 5px 14px rgba(220, 38, 38, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.5);
    }
    .keycap-hit:active, .keycap-hit.active {
      transform: translateY(4px);
      border-bottom-width: 1.5px;
      background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.95);
    }

    /* ─── 核心自適應佈局 (球場在上方完整呈現、手把在下方，絕不互相遮擋) ─── */
    .game-ui {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      justify-content: space-between;
      box-sizing: border-box;
    }
    .canvas-container {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 10px 10px 10px;
      box-sizing: border-box;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 432 / 304;
      object-fit: contain;
      background: #0f172a;
      image-rendering: auto;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.15);
    }
    .controls {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px max(34px, calc(env(safe-area-inset-bottom, 0px) + 26px)) 16px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      box-sizing: border-box;
      z-index: 25;
      flex-shrink: 0;
    }

    /* ─── 僅在超寬橫向螢幕 (寬高比 >= 1.7) 啟用兩側懸浮手把 ─── */
    @media screen and (min-aspect-ratio: 17/10) and (min-height: 320px) {
      .canvas-container {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        padding: 50px 20px 20px 20px;
      }
      .controls {
        position: absolute;
        bottom: max(32px, calc(env(safe-area-inset-bottom, 0px) + 24px));
        left: 0;
        background: transparent;
        border-top: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        padding: 0 max(24px, env(safe-area-inset-right, 24px));
        pointer-events: none;
      }
    }

    /* ─── 結算彈窗 ─── */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.25s ease;
    }
    .modal-card {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 24px 30px;
      text-align: center;
      max-width: 320px;
      width: 85%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      color: white;
    }
    .modal-icon { font-size: 52px; margin-bottom: 8px; }
    .modal-title { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
    .modal-desc { font-size: 13px; color: rgba(255,255,255,0.8); margin-bottom: 20px; line-height: 1.5; }
    .modal-btns { display: flex; flex-direction: column; gap: 10px; }
    .modal-btn {
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.15s;
    }
    .modal-btn.primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
    }
    .modal-btn.secondary {
      background: rgba(255,255,255,0.15);
      color: white;
    }
    .modal-btn:active { transform: scale(0.97); }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="screen-game">
    <div class="game-ui">
      <!-- 返回大廳按鈕 -->
      <button class="btn-back-lobby" onclick="window.location.href='./lobby.html'" title="返回大廳">🔙</button>

      <!-- 錦標賽階段 HUD -->
      <div class="tournament-hud" id="tournament-hud">
        🏆 <span id="tournament-round-title">第一輪 八強賽</span>
      </div>

      <!-- 畫布容器 -->
      <div class="canvas-container">
        <canvas id="game-canvas"></canvas>
      </div>

      <!-- 分離式左/右名字與計分板 -->
      <div class="score-badge player-badge">
        <div class="badge-label" id="player-name-badge">👦 玩家</div>
        <div class="badge-score" id="my-score-vs">0</div>
      </div>
      <div class="score-badge comp-badge">
        <div class="badge-label" id="opponent-name-badge">👰 KAY</div>
        <div class="badge-score" id="comp-score-vs">0</div>
      </div>

      <!-- 實體鍵盤風格手把 (左手 WASD 箭頭鍵盤 ＋ 右手動作鍵盤) -->
      <div class="controls">
        <!-- 左手：鍵盤方向鍵區 (上排 ▲，下排 ◀ ▼ ▶ 同一水平線！) -->
        <div class="keyboard-cluster" id="keyboard-cluster">
          <div class="keycap-row">
            <button class="keycap-btn" id="dpad-up" aria-label="上 (W)">
              <span class="keycap-icon">▲</span>
              <span class="keycap-sub">W</span>
            </button>
          </div>
          <div class="keycap-row">
            <button class="keycap-btn" id="dpad-left" aria-label="左 (A)">
              <span class="keycap-icon">◀</span>
              <span class="keycap-sub">A</span>
            </button>
            <button class="keycap-btn" id="dpad-down" aria-label="下 (S)">
              <span class="keycap-icon">▼</span>
              <span class="keycap-sub">S</span>
            </button>
            <button class="keycap-btn" id="dpad-right" aria-label="右 (D)">
              <span class="keycap-icon">▶</span>
              <span class="keycap-sub">D</span>
            </button>
          </div>
        </div>

        <!-- 右手：鍵盤動作按鈕 (跳躍 Jump ＋ 殺球 Hit) -->
        <div class="keycap-action-group">
          <button class="keycap-btn keycap-action-btn keycap-jump" id="btn-jump" aria-label="跳躍">
            <span class="keycap-icon">🚀</span>
            <span class="keycap-label">跳躍</span>
            <span class="keycap-sub">Space</span>
          </button>
          <button class="keycap-btn keycap-action-btn keycap-hit" id="btn-hit" aria-label="殺球">
            <span class="keycap-icon">⚡</span>
            <span class="keycap-label">殺球</span>
            <span class="keycap-sub">J 鍵</span>
          </button>
        </div>
      </div>

      <!-- 比賽結果彈窗 -->
      <div class="modal-overlay" id="match-modal">
        <div class="modal-card">
          <div class="modal-icon" id="modal-icon">🎉</div>
          <div class="modal-title" id="modal-title">勝利！</div>
          <div class="modal-desc" id="modal-desc">獲得積分！</div>
          <div class="modal-btns">
            <button class="modal-btn primary" id="modal-btn-next">再戰一場 ➔</button>
            <button class="modal-btn secondary" id="modal-btn-lobby" onclick="window.location.href='./lobby.html'">返回大廳</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
